<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>{% if page.title %}{{ page.title }}{% if page.description %}. {{ page.description }}{% endif %}{% else %}{{ site.title }} {{ site.description }}{% endif %}</title>
  
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  {% seo title=false %}
  {% feed_meta %}
</head>
<body class="{% if page.layout == 'post' %}page-post{% else %}page-index{% endif %}">
  <div class="layout">
    <header class="top-row">
      <div class="neofetch-container">
        <div class="avatar-container">
          <div class="avatar-header"><span class="syn-keyword">imgcat</span> <span class="syn-var">avatar.png</span></div>
          <img src="https://github.com/kpebetka.png" alt="kpebetka avatar">
        </div>
        <div class="neofetch-info">
          <span class="host">kpebetka</span><span class="syn-comment">@</span><span class="syn-string">blog</span><br>
          <div class="divider"></div>
          <div class="term-content">
            <div class="key">Branch</div><div class="val">: main</div>
            <div class="key">Commits</div><div class="val">: {{ site.posts.size }}</div>
          </div>
          <div class="divider divider-export"></div>
          <div class="export-content">
            <span class="syn-keyword">export</span> <span class="syn-var">GIT</span> = <a href="https://github.com/kpebetka" target="_blank" rel="noopener noreferrer" class="post-title-link">"https://github.com/kpebetka"</a><br>
            <span class="syn-keyword">export</span> <span class="syn-var">RSS</span> = <a href="{{ '/feed.xml' | relative_url }}" target="_blank" rel="noopener noreferrer" class="post-title-link">"/feed.xml"</a>
          </div>
        </div>
      </div>
      
      <div class="links-block">
        <div>
          <span class="syn-keyword">tree</span> <span class="syn-var">~/projects</span><br>
          <span class="syn-comment">├──</span> <a href="https://burnafterreading.kpebetka.net/" target="_blank" rel="noopener noreferrer" class="post-title-link" style="color: #ce9178;">One-time secret messages</a><br>
          <span class="syn-comment">└──</span> <a href="https://kpebetka.github.io/passphrase-generator/trigrams/" target="_blank" rel="noopener noreferrer" class="post-title-link" style="color: #ce9178;">Secure passphrase generator</a>
        </div>
      </div>
    </header>
    
    {{ content }}
  </div>
</body>
</html>
