<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDE Editor — kpebetka</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <style>
        :root {
            --bg: #0a0e0a; --surface: #0f140f; --surface-2: #151b15;
            --border: #1e281e; --border-strong: #2e3e2e;
            --text: #a8c4a8; --muted: #6b8a6b;
            --accent: #4db86a; --accent-hover: #63cd80;
            --radius: 8px;
            --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Consolas, monospace;
            --card-shadow: 0 0 20px rgba(77, 184, 106, 0.02), 0 8px 30px rgba(0, 0, 0, 0.55);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-mono); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .editor-header { background-color: var(--surface); border-bottom: 1px solid var(--border-strong); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .editor-header h1 { font-size: 16px; color: var(--text); }
        .editor-header h1 span { color: var(--accent); }
        .actions button { background-color: var(--surface-2); color: var(--accent); border: 1px solid var(--border); padding: 6px 12px; border-radius: var(--radius); font-family: var(--font-mono); font-size: 12px; cursor: pointer; transition: all 0.2s; margin-left: 10px; }
        .actions button:hover { background-color: var(--accent); color: var(--bg); }
        .editor-layout { display: flex; flex: 1; overflow: hidden; }
        .meta-sidebar { width: 250px; background-color: var(--surface); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 12px; color: var(--muted); }
        .form-group input { background-color: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 4px; font-family: var(--font-mono); font-size: 12px; outline: none; }
        .form-group input:focus { border-color: var(--accent); }
        .workspace { display: flex; flex: 1; overflow: hidden; }
        .pane { flex: 1; display: flex; flex-direction: column; width: 50%; }
        .pane-header { background-color: var(--surface-2); padding: 5px 15px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); display: flex; justify-content: space-between; }
        textarea { flex: 1; background-color: var(--bg); color: #ce9178; border: none; border-left: 1px solid var(--border); padding: 20px; font-family: var(--font-mono); font-size: 14px; line-height: 1.6; resize: none; outline: none; }
        .preview { flex: 1; background-color: var(--bg); border-left: 1px solid var(--border); padding: 30px; overflow-y: auto; line-height: 1.7; font-size: 14px; }
        .preview h1, .preview h2, .preview h3, .preview h4 { color: var(--text); margin-top: 1.8em; margin-bottom: 0.8em; font-weight: 700; line-height: 1.4; }
        .preview h2 { font-size: 20px; }
        .preview h3 { font-size: 18px; }
        .preview h4 { font-size: 16px; }
        .preview h2::before, .preview h3::before, .preview h4::before { content: "// "; color: var(--muted); }
        .preview p { margin-bottom: 1.2em; }
        .preview a { color: var(--accent); text-decoration: none; }
        .preview a:hover { text-decoration: underline; }
        .preview ul, .preview ol { margin-bottom: 1.2em; padding-left: 24px; }
        .preview li { margin-bottom: 0.5em; }
        .preview blockquote { border-left: 3px solid var(--accent); background-color: var(--surface); padding: 10px 15px; margin-bottom: 1.5em; color: var(--muted); font-style: italic; }
        .preview hr { border: 0; border-bottom: 1px dashed var(--border); margin: 2em 0; }
        .preview code:not(pre code) { background-color: var(--surface-2); color: #ce9178; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); font-size: 0.9em; }
        .preview .code-container { background-color: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius); margin-bottom: 1.5em; overflow: hidden; box-shadow: var(--card-shadow); text-align: left; }
        .preview .code-header { display: flex; justify-content: space-between; align-items: center; background-color: var(--surface-2); padding: 6px 15px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); }
        .preview .code-lang { text-transform: uppercase; font-weight: 700; }
        .preview .code-actions { display: flex; gap: 10px; }
        .preview .code-actions button { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; transition: color 0.2s; border-radius: 4px; }
        .preview .code-actions button:hover { color: var(--accent); background-color: rgba(77, 184, 106, 0.1); }
        .preview .code-actions svg { width: 14px; height: 14px; }
        .preview pre { margin: 0 !important; border: none !important; border-radius: 0 !important; box-shadow: none !important; padding: 15px !important; background-color: var(--surface); overflow-x: auto; white-space: pre; }
        .preview pre code { font-family: var(--font-mono); font-size: 13px; line-height: 1.5; display: block; background: transparent !important; padding: 0 !important; border: none !important; }
        .preview .img-block { margin: 2em auto; text-align: center; }
        .preview .img-block img { max-width: 100%; height: auto; border-radius: var(--radius); border: 1px solid var(--border-strong); box-shadow: var(--card-shadow); display: block; margin: 0 auto; }
        .preview .img-block figcaption { margin-top: 8px; font-size: 12px; color: var(--muted); font-style: italic; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--surface); }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
        @media (max-width: 900px) {
            .editor-layout { flex-direction: column; }
            .meta-sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; }
            .form-group { flex: 1; min-width: 120px; }
            .workspace { flex-direction: column; }
            .pane { width: 100%; height: 50%; }
            textarea, .preview { border-left: none; border-top: 1px solid var(--border); }
        }
    </style>
</head>
<body>
    <header class="editor-header">
        <h1>kpebetka <span>// markdown editor</span></h1>
        <div class="actions">
            <button onclick="downloadMarkdown()">[ Download .md ]</button>
        </div>
    </header>
    <div class="editor-layout">
        <aside class="meta-sidebar">
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="meta-title" placeholder="Заголовок поста" oninput="updatePreview()">
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" id="meta-desc" placeholder="Краткое описание" oninput="updatePreview()">
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="meta-date" oninput="updatePreview()">
            </div>
        </aside>
        <div class="workspace">
            <div class="pane">
                <div class="pane-header">
                    <span>Editor.md</span>
                    <span>Markdown</span>
                </div>
                <textarea id="markdown-input" placeholder="Пиши здесь свой текст..." oninput="updatePreview()"></textarea>
            </div>
            <div class="pane">
                <div class="pane-header">
                    <span>Preview.html</span>
                    <span>Rendered</span>
                </div>
                <div class="preview" id="preview-output"></div>
            </div>
        </div>
    </div>
    <script>
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try { return hljs.highlight(code, { language: lang }).value; } catch (err) {}
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true
        });
        document.getElementById('meta-date').valueAsDate = new Date();
        const ICONS = {
            copy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`,
            check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
            download: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`
        };
        function updatePreview() {
            const markdownText = document.getElementById('markdown-input').value;
            const previewDiv = document.getElementById('preview-output');
            previewDiv.innerHTML = marked.parse(markdownText);
            previewDiv.querySelectorAll('img').forEach(img => {
                if (img.parentElement.tagName.toLowerCase() === 'figure') return;
                const figure = document.createElement('figure');
                figure.className = 'img-block';
                const parentP = img.closest('p');
                if (parentP && parentP.textContent.trim() === '') {
                    parentP.parentNode.insertBefore(figure, parentP);
                    parentP.remove();
                } else {
                    img.parentNode.insertBefore(figure, img);
                }
                figure.appendChild(img);
                const altText = img.getAttribute('alt');
                if (altText) {
                    const figcaption = document.createElement('figcaption');
                    figcaption.textContent = altText;
                    figure.appendChild(figcaption);
                }
            });
            previewDiv.querySelectorAll('pre').forEach(pre => {
                if (pre.parentElement.classList.contains('code-container')) return;
                const code = pre.querySelector('code');
                if (!code) return;
                let lang = 'text';
                code.classList.forEach(cls => {
                    if (cls.startsWith('language-')) lang = cls.replace('language-', '');
                });
                const wrapper = document.createElement('div');
                wrapper.className = 'code-container';
                const header = document.createElement('div');
                header.className = 'code-header';
                header.innerHTML = `
                    <span class="code-lang">${lang}</span>
                    <div class="code-actions">
                        <button class="btn-copy" title="Копировать">${ICONS.copy}</button>
                        <button class="btn-download" title="Скачать">${ICONS.download}</button>
                    </div>
                `;
                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(header);
                wrapper.appendChild(pre);
                const btnCopy = header.querySelector('.btn-copy');
                const btnDownload = header.querySelector('.btn-download');
                btnCopy.addEventListener('click', () => {
                    navigator.clipboard.writeText(code.textContent).then(() => {
                        btnCopy.innerHTML = ICONS.check;
                        setTimeout(() => btnCopy.innerHTML = ICONS.copy, 2000);
                    }).catch(err => console.error('Copy failed:', err));
                });
                btnDownload.addEventListener('click', () => {
                    const blob = new Blob([code.textContent], { type: 'text/plain;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `snippet.${lang === 'text' ? 'txt' : lang}`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });
            });
        }
        function downloadMarkdown() {
            const title = document.getElementById('meta-title').value || 'new-post';
            const desc = document.getElementById('meta-desc').value || '';
            const dateVal = document.getElementById('meta-date').value;
            const content = document.getElementById('markdown-input').value;
            if (!dateVal) { alert("Пожалуйста, укажите дату."); return; }
            const safeTitle = title.replace(/"/g, '\\"');
            const safeDesc = desc.replace(/"/g, '\\"');
            let frontMatter = `---\nlayout: post\n`;
            frontMatter += `title: "${safeTitle}"\n`;
            if (safeDesc) frontMatter += `description: "${safeDesc}"\n`;
            frontMatter += `date: ${dateVal} 12:00:00 +0000\n---\n\n`;
            const fullPost = frontMatter + content;
            const slug = title.toLowerCase().replace(/[^a-zа-яё0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-');
            const fileName = `${dateVal}-${slug || 'post'}.md`;
            const blob = new Blob([fullPost], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        updatePreview();
    </script>
</body>
</html>
