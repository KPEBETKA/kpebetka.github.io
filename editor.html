---
sitemap: false
---
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>IDE Editor — kpebetka</title>
    
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/languages/nginx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/languages/ini.min.js"></script>

    <style>
        :root {
            --bg: #0a0e0a; --surface: #0f140f; --surface-2: #151b15;
            --border: #1e281e; --border-strong: #2e3e2e;
            --text: #a8c4a8; --muted: #6b8a6b;
            --accent: #4db86a; --accent-hover: #63cd80;
            --radius: 8px;
            --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Consolas, monospace;
            --card-shadow: 0 0 20px rgba(77, 184, 106, 0.02), 0 8px 30px rgba(0, 0, 0, 0.55);
            
            --scanline-opacity: 0.10;
            --vignette-opacity: 0.35;
            --glow-opacity: 0.30;
            --glare-opacity: 0.05;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::selection { background: var(--accent); color: var(--bg); }
        
        body { 
            font-family: var(--font-mono); 
            background: var(--bg); 
            color: var(--text); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            text-shadow: 0 0 calc(4px * var(--glow-opacity)) currentColor;
        }

        .editor-header { 
            background-color: var(--surface); 
            border-bottom: 1px solid var(--border-strong); 
            padding: 10px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 10;
        }
        .editor-header h1 { font-size: 16px; color: var(--text); }
        .editor-header h1 span { color: var(--accent); }
        
        .actions button { 
            background-color: var(--surface-2); 
            color: var(--accent); 
            border: 1px solid var(--border); 
            padding: 6px 12px; 
            border-radius: var(--radius); 
            font-family: var(--font-mono); 
            font-size: 12px; 
            cursor: pointer; 
            transition: all 0.2s; 
            margin-left: 10px; 
        }
        .actions button:hover { background-color: var(--accent); color: var(--bg); }

        .editor-layout { display: flex; flex-direction: column; flex: 1; overflow: hidden; z-index: 10; }
        
        .meta-sidebar { 
            width: 100%; 
            background-color: var(--surface); 
            border-bottom: 1px solid var(--border); 
            padding: 15px 20px; 
            display: flex; 
            flex-direction: row; 
            flex-wrap: wrap; 
            gap: 15px; 
            align-items: center; 
        }
        .form-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 150px; }
        .form-group label { font-size: 12px; color: var(--muted); }
        .form-group input { 
            background-color: var(--surface-2); 
            border: 1px solid var(--border); 
            color: var(--text); 
            padding: 8px; 
            border-radius: 4px; 
            font-family: var(--font-mono); 
            font-size: 12px; 
            outline: none; 
            width: 100%; 
        }
        .form-group input:focus { border-color: var(--accent); }

        .workspace { display: flex; flex: 1; overflow: hidden; }
        .pane { flex: 1; display: flex; flex-direction: column; width: 50%; }
        .pane-header { 
            background-color: var(--surface-2); 
            padding: 5px 15px; 
            font-size: 11px; 
            color: var(--muted); 
            border-bottom: 1px solid var(--border); 
            border-left: 1px solid var(--border); 
            display: flex; 
            justify-content: space-between; 
        }
        
        textarea { 
            flex: 1; 
            background-color: var(--bg); 
            color: #ce9178; 
            border: none; 
            border-left: 1px solid var(--border); 
            padding: 20px; 
            font-family: var(--font-mono); 
            font-size: 14px; 
            line-height: 1.6; 
            resize: none; 
            outline: none; 
        }
        .preview { 
            flex: 1; 
            background-color: var(--bg); 
            border-left: 1px solid var(--border); 
            padding: 30px; 
            overflow-y: auto; 
            line-height: 1.7; 
            font-size: 14px; 
        }

        .preview h1, .preview h2, .preview h3, .preview h4, .preview h5, .preview h6 { 
            color: var(--text); 
            margin-top: 1.8em; 
            margin-bottom: 0.8em; 
            font-weight: 700; 
            line-height: 1.4; 
        }
        .preview h1 { font-size: 24px; }
        .preview h2 { font-size: 20px; }
        .preview h3 { font-size: 18px; }
        .preview h4 { font-size: 16px; }
        .preview h5 { font-size: 14px; }
        .preview h6 { font-size: 13px; }
        
        .preview h1::before { content: "# "; color: var(--muted); }
        .preview h2::before { content: "## "; color: var(--muted); }
        .preview h3::before { content: "### "; color: var(--muted); }
        .preview h4::before { content: "#### "; color: var(--muted); }
        .preview h5::before { content: "##### "; color: var(--muted); }
        .preview h6::before { content: "###### "; color: var(--muted); }

        .preview p { margin-bottom: 1.2em; }
        .preview a { color: var(--accent); text-decoration: none; }
        .preview a:hover { text-decoration: underline; }
        .preview ul, .preview ol { margin-bottom: 1.2em; padding-left: 24px; }
        .preview li { margin-bottom: 0.5em; }

        .preview blockquote { 
            border-left: 3px solid var(--accent); 
            background-color: var(--surface); 
            padding: 10px 15px; 
            margin: 1.5em 0; 
            color: var(--muted); 
            font-style: italic; 
            border-radius: 0 4px 4px 0;
        }
        .preview blockquote p:last-child { margin-bottom: 0; }
        .preview blockquote blockquote { 
            border-left-color: var(--muted); 
            background-color: var(--bg); 
            margin-top: 10px; 
            margin-bottom: 0; 
        }

        .preview hr { border: 0; border-bottom: 1px dashed var(--border); margin: 2em 0; }
        
        .preview code:not(pre code) { 
            background-color: var(--surface-2); 
            color: #ce9178; 
            padding: 2px 6px; 
            border-radius: 4px; 
            border: 1px solid var(--border); 
            font-size: 0.9em; 
        }
        
        .preview .code-container { 
            background-color: var(--surface); 
            border: 1px solid var(--border-strong); 
            border-radius: var(--radius); 
            margin-bottom: 1.5em; 
            overflow: hidden; 
            box-shadow: var(--card-shadow); 
            text-align: left; 
        }
        .preview .code-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background-color: var(--surface-2); 
            padding: 6px 15px; 
            font-size: 12px; 
            color: var(--muted); 
            border-bottom: 1px solid var(--border); 
        }
        .preview .code-lang { text-transform: uppercase; font-weight: 700; }
        .preview .code-actions { display: flex; gap: 10px; }
        .preview .code-actions button { 
            background: transparent; 
            border: none; 
            color: var(--muted); 
            cursor: pointer; 
            padding: 4px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: color 0.2s; 
            border-radius: 4px; 
        }
        .preview .code-actions button:hover { color: var(--accent); background-color: rgba(77, 184, 106, 0.1); }
        .preview .code-actions svg { width: 14px; height: 14px; }

        .preview pre { 
            margin: 0 !important; 
            border: none !important; 
            border-radius: 0 !important; 
            box-shadow: none !important; 
            padding: 15px !important; 
            background-color: var(--surface); 
            overflow-x: auto; 
            white-space: pre; 
        }
        .preview pre code { 
            font-family: var(--font-mono); 
            font-size: 13px; 
            line-height: 1.5; 
            display: block; 
            background: transparent !important; 
            padding: 0 !important; 
            border: none !important; 
            text-shadow: none;
        }
        
        .preview .img-block { margin: 2em auto; text-align: center; }
        .preview .img-block img { 
            max-width: 100%; 
            height: auto; 
            border-radius: var(--radius); 
            border: 1px solid var(--border-strong); 
            box-shadow: var(--card-shadow); 
            display: block; 
            margin: 0 auto; 
        }
        .preview .img-block figcaption { margin-top: 8px; font-size: 12px; color: var(--muted); font-style: italic; }

        .preview mark { 
            background-color: var(--text); 
            color: var(--bg); 
            padding: 0 6px; 
            border-radius: 4px; 
            font-weight: 700; 
            text-shadow: none;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--surface); }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
        
        @media (max-width: 900px) {
            .workspace { flex-direction: column; }
            .pane { width: 100%; height: 50%; }
            textarea, .preview { border-left: none; border-top: 1px solid var(--border); }
        }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 9999;
            background-image: 
                radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, var(--vignette-opacity)) 100%),
                repeating-linear-gradient(0deg, rgba(0, 0, 0, var(--scanline-opacity)), rgba(0, 0, 0, var(--scanline-opacity)) 1px, transparent 1px, transparent 3px),
                repeating-linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.02)),
                linear-gradient(135deg, rgba(255, 255, 255, var(--glare-opacity)) 0%, transparent 35%, transparent 65%, rgba(255, 255, 255, calc(var(--glare-opacity) * 0.4)) 100%);
            background-size: 100% 100%, 100% 3px, 3px 100%, 100% 100%;
        }

        body::after {
            content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(20, 25, 20, 0.08);
            pointer-events: none; z-index: 10000; animation: crt-flicker 0.15s infinite;
        }

        @keyframes crt-flicker { 0% { opacity: 0.92; } 50% { opacity: 1; } 100% { opacity: 0.92; } }
    </style>
</head>
<body>

    <header class="editor-header">
        <h1>kpebetka <span>// markdown editor</span></h1>
        <div class="actions">
            <button onclick="downloadMarkdown()">[ Download .md ]</button>
        </div>
    </header>

    <div class="editor-layout">
        <aside class="meta-sidebar">
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="meta-title" placeholder="Заголовок поста" oninput="triggerUpdate()">
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" id="meta-desc" placeholder="Краткое описание" oninput="triggerUpdate()">
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="meta-date" oninput="triggerUpdate()">
            </div>
        </aside>

        <div class="workspace">
            <div class="pane">
                <div class="pane-header">
                    <span>Editor.md</span>
                    <span>Markdown</span>
                </div>
                <textarea id="markdown-input" placeholder="Пиши здесь свой текст..." oninput="triggerUpdate()"></textarea>
            </div>

            <div class="pane">
                <div class="pane-header">
                    <span>Preview.html</span>
                    <span>Rendered</span>
                </div>
                <div class="preview" id="preview-output"></div>
            </div>
        </div>
    </div>

    <script>
        if (typeof hljs !== 'undefined') {
            if (!hljs.getLanguage('conf') && hljs.getLanguage('ini')) {
                hljs.registerAliases(['conf'], { languageName: 'ini' });
            }
        }

        marked.use({
            extensions: [{
                name: 'mark',
                level: 'inline',
                start: src => src.indexOf('=='),
                tokenizer(src) {
                    const match = /^==([^=]+)==/.exec(src);
                    if (match) return { type: 'mark', raw: match[0], text: match[1].trim(), tokens: this.lexer.inlineTokens(match[1].trim()) };
                },
                renderer(token) {
                    return `<mark>${this.parser.parseInline(token.tokens)}</mark>`;
                }
            }]
        });

        marked.setOptions({
            highlight: (code, lang) => {
                if (lang && hljs.getLanguage(lang)) {
                    try { return hljs.highlight(code, { language: lang }).value; } catch (e) {}
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true
        });

        document.getElementById('meta-date').valueAsDate = new Date();

        const ICONS = {
            copy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`,
            check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
            download: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`
        };

        let debounceTimer;
        const textareaEl = document.getElementById('markdown-input');
        const previewEl = document.getElementById('preview-output');

        function triggerUpdate() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(updatePreview, 150);
        }

        function updatePreview() {
            const scrollPercentage = textareaEl.scrollHeight > textareaEl.clientHeight ? textareaEl.scrollTop / (textareaEl.scrollHeight - textareaEl.clientHeight) : 0;

            previewEl.innerHTML = marked.parse(textareaEl.value);

            previewEl.querySelectorAll('img').forEach(img => {
                if (img.parentElement.tagName.toLowerCase() === 'figure') return;
                
                const figure = document.createElement('figure');
                figure.className = 'img-block';
                
                const parentP = img.closest('p');
                const container = (parentP && parentP.textContent.trim() === '') ? parentP : img;
                
                container.parentNode.insertBefore(figure, container);
                figure.appendChild(img);
                
                if (parentP && parentP.textContent.trim() === '') {
                    parentP.remove();
                }

                if (img.alt) {
                    const figcaption = document.createElement('figcaption');
                    figcaption.textContent = img.alt;
                    figure.appendChild(figcaption);
                }
            });

            previewEl.querySelectorAll('pre').forEach(pre => {
                if (pre.parentElement.classList.contains('code-container')) return;
                const code = pre.querySelector('code');
                if (!code) return;

                let lang = 'text';
                code.classList.forEach(cls => {
                    if (cls.startsWith('language-')) lang = cls.replace('language-', '');
                });

                const wrapper = document.createElement('div');
                wrapper.className = 'code-container';
                wrapper.innerHTML = `
                    <div class="code-header">
                        <span class="code-lang">${lang}</span>
                        <div class="code-actions">
                            <button class="btn-copy" title="Копировать">${ICONS.copy}</button>
                            <button class="btn-download" title="Скачать">${ICONS.download}</button>
                        </div>
                    </div>
                `;
                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(pre);
            });

            const targetMax = previewEl.scrollHeight - previewEl.clientHeight;
            if (targetMax > 0) {
                isSyncing = true;
                previewEl.scrollTop = scrollPercentage * targetMax;
                requestAnimationFrame(() => isSyncing = false);
            }
        }

        function downloadMarkdown() {
            const title = document.getElementById('meta-title').value || 'new-post';
            const desc = document.getElementById('meta-desc').value || '';
            const dateVal = document.getElementById('meta-date').value;
            const content = textareaEl.value;

            if (!dateVal) return alert("Пожалуйста, укажите дату.");

            const safeTitle = title.replace(/"/g, '\\"');
            const safeDesc = desc.replace(/"/g, '\\"');
            const permalink = `/${dateVal.replace(/-/g, '/')}/`;

            const frontMatter = `---\nlayout: post\ntitle: "${safeTitle}"\n${safeDesc ? `description: "${safeDesc}"\n` : ''}date: ${dateVal} 12:00:00 +0000\npermalink: ${permalink}\n---\n\n`;
            
            const blob = new Blob([frontMatter + content], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${dateVal}.md`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        let isSyncing = false;
        
        function syncScroll(e) {
            if (isSyncing) return;
            isSyncing = true;

            const isSourceTextarea = e.target === textareaEl;
            const source = isSourceTextarea ? textareaEl : previewEl;
            const target = isSourceTextarea ? previewEl : textareaEl;

            const sourceMax = source.scrollHeight - source.clientHeight;
            const targetMax = target.scrollHeight - target.clientHeight;

            if (sourceMax > 0) {
                target.scrollTop = (source.scrollTop / sourceMax) * targetMax;
            }

            requestAnimationFrame(() => isSyncing = false);
        }

        textareaEl.addEventListener('scroll', syncScroll);
        previewEl.addEventListener('scroll', syncScroll);

        previewEl.addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const wrapper = btn.closest('.code-container');
            const code = wrapper.querySelector('code');

            if (btn.classList.contains('btn-copy')) {
                navigator.clipboard.writeText(code.textContent).then(() => {
                    btn.innerHTML = ICONS.check;
                    setTimeout(() => btn.innerHTML = ICONS.copy, 2000);
                }).catch(console.error);
            }

            if (btn.classList.contains('btn-download')) {
                const lang = wrapper.querySelector('.code-lang').textContent.toLowerCase();
                const blob = new Blob([code.textContent], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `snippet.${lang === 'text' ? 'txt' : lang}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        });

        updatePreview();
    </script>
</body>
</html>
